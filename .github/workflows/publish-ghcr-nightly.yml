name: Publish container nightly

# Sibling to docker-image.yml, which is the release-tag lane
# (v*.*.* → :X.Y.Z + :latest, ghcr.io/<owner>/od, spec §15.1).
#
# This workflow is the dev-validation lane:
#   - push to main       → ghcr.io/<owner>/od:nightly
#   - pull request       → build only, no push (PRs from forks cannot
#                          use the default GITHUB_TOKEN for write
#                          scopes, and the build result is not a
#                          value we want stored as a tag anyway)
#   - workflow_dispatch  → manual refresh of :nightly
#
# Tag policy matches docker-image.yml's package convention (`:od`,
# not `:open-design`) so the two workflows publish into the same
# GHCR package without collision. :nightly is mutable per-push; do
# not pin production runs to it. For reproducible pulls use the
# immutable :main-<sha> tag or a release :X.Y.Z from
# docker-image.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push (nightly on main, build-only on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          # PR builds verify the Dockerfile still resolves; only
          # main pushes and manual dispatches publish to the
          # registry. The default GITHUB_TOKEN on a fork PR has no
          # packages: write scope, so this guard is also the one
          # that keeps the workflow runnable for external
          # contributors.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/od:nightly
            ghcr.io/${{ github.repository_owner }}/od:main-${{ steps.sha.outputs.short }}
          # `:nightly` is the live mutable alias; `:main-<sha>` is
          # the immutable per-push pin. A user wanting the
          # artifact of commit abc1234f pulls
          # `ghcr.io/<owner>/od:main-abc1234f` and gets exactly
          # that build, even after later commits move :nightly.
          labels: |
            org.opencontainers.image.title=Open Design
            org.opencontainers.image.description=Dev-validation build of Open Design, refreshed on every push to main.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
