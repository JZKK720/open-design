# yaml-language-server: $schema=./docs/schemas/compose-spec.json
name: open-design

services:
  open-design-daemon:
    image: ghcr.io/${OPEN_DESIGN_IMAGE_OWNER:-jzkk720}/${OPEN_DESIGN_IMAGE_REPOSITORY:-open-design}-daemon:${OPEN_DESIGN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.daemon
    pull_policy: always
    environment:
      OD_BIND_HOST: 0.0.0.0
      OD_API_TOKEN: ${OD_API_TOKEN:?Set OD_API_TOKEN in your .env or shell}
      OD_DATA_DIR: /data
      OD_PORT: 7456
      OD_WEB_PORT: ${OD_WEB_PORT:-7831}
      OD_DEFAULT_MODE: ${OD_DEFAULT_MODE:-}
      OD_DEFAULT_API_PROTOCOL: ${OD_DEFAULT_API_PROTOCOL:-}
      OD_DEFAULT_API_BASE_URL: ${OD_DEFAULT_API_BASE_URL:-}
      OD_DEFAULT_API_MODEL: ${OD_DEFAULT_API_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7456:7456"
    restart: unless-stopped
    volumes:
      - open-design-data:/data

  open-design-web:
    image: ghcr.io/${OPEN_DESIGN_IMAGE_OWNER:-jzkk720}/${OPEN_DESIGN_IMAGE_REPOSITORY:-open-design}-web:${OPEN_DESIGN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    pull_policy: always
    depends_on:
      - open-design-daemon
    environment:
      OD_API_TOKEN: ${OD_API_TOKEN:?Set OD_API_TOKEN in your .env or shell}
    command:
      - /bin/sh
      - -c
      - envsubst '$$OD_API_TOKEN' < /opt/open-design/nginx/open-design.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    ports:
      - "7831:80"
    restart: unless-stopped
    volumes:
      - ./docker/nginx/open-design.conf.template:/opt/open-design/nginx/open-design.conf.template:ro

volumes:
  open-design-data: